services:
  backend:
    build:
      context: ./backend
    command: uvicorn minegen.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MINEGEN_DATA_DIR: /data
      MINEGEN_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/src:/app/src
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
