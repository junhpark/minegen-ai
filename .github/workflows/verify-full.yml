# VA-01 FULL tier → AC-01H: the ONE CI release authority.
#
# Three COMPONENT jobs run the release gate list through scripts/verify.py —
# backend (ruff · format · mypy · pytest UNFILTERED · collection proof),
# frontend (typecheck · lint · prettier · vitest · build) and e2e (the
# guided-workflow browser test as a REQUIRED gate: the backend job has no
# frontend toolchain, so the unfiltered pytest SKIPS it there, and a skip is
# not evidence — PR #53 review round 3 B3) — and each publishes its
# machine-readable verification-summary.json. A fourth job,
# release-authority, downloads the summaries and re-judges them with
# `verify.py authority`: every required gate PASSED by some component, the
# pytest command actually unfiltered, the collection proof satisfied, every
# component clean and unchanged, and all of them certifying the SAME revision.
# That aggregate is the release verdict. A green component job is component
# EVIDENCE, never the verdict; a missing component summary is a typed
# withheld verdict (the job runs `if: always()` and fails closed), never a
# skipped job. On a pull_request run the certified SHA is GitHub's synthetic
# merge commit (PULL_REQUEST_MERGE_SIMULATION) — recorded as such, never
# relabelled as the PR head.
name: Verify FULL

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-backend:
    name: FULL backend (ruff · mypy · pytest unfiltered · coverage proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: tests/test_layout_characterization.py runs the freeze-SHA
          # production source (git archive <sha> backend/src) on THIS runner and
          # fails, never skips, if the commit is not in the clone (AC-01G)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: verify full (backend component)
        run: python scripts/verify.py full --backend-only
      - name: Upload backend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-full-backend
          path: backend/.verification/
          # .verification is a dotted directory: without this the upload finds
          # nothing (the pre-AC-01H runs published 0 artifacts)
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full-frontend:
    name: FULL frontend (typecheck · lint · prettier · vitest · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: verify full (frontend component)
        # the same runner implementation as the backend component, so the
        # summary is produced by verify.py, never assembled by hand
        run: python scripts/verify.py full --frontend-only
      - name: Upload frontend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-full-frontend
          path: backend/.verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full-e2e:
    name: FULL e2e (guided-workflow browser test, required)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: backend
        run: python -m playwright install --with-deps chromium
      - name: verify full (e2e component)
        # MINEGEN_E2E_REQUIRED=1 inside the runner: a missing toolchain or
        # browser FAILS the test instead of skipping it, and the gate refuses
        # a run that executed nothing or skipped anything
        run: python scripts/verify.py full --e2e-only
      - name: Upload e2e verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-full-e2e
          path: backend/.verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release-authority:
    name: Release Authority
    runs-on: ubuntu-latest
    needs: [full-backend, full-frontend, full-e2e]
    # fail CLOSED: run even when a component failed or never uploaded, so the
    # verdict is a recorded, typed refusal instead of a skipped job
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download backend component evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verification-full-backend
          path: components/full-backend
      - name: Download frontend component evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verification-full-frontend
          path: components/full-frontend
      - name: Download e2e component evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verification-full-e2e
          path: components/full-e2e
      - name: Aggregate release authority
        # every path is passed whether or not the download succeeded: a path
        # that does not exist is COMPONENT_SUMMARY_MISSING in the verdict and
        # the command exits 1 — the aggregate never judges a smaller set
        run: |
          python scripts/verify.py authority \
            components/full-backend/verification-summary.json \
            components/full-frontend/verification-summary.json \
            components/full-e2e/verification-summary.json
      - name: Collect the evidence package
        if: always()
        run: |
          mkdir -p backend/.verification/components
          for c in full-backend full-frontend full-e2e; do
            if [ -f "components/$c/verification-summary.json" ]; then
              cp "components/$c/verification-summary.json" "backend/.verification/components/$c.verification-summary.json"
            fi
          done
          ls -la backend/.verification backend/.verification/components
      - name: Upload release authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-release-authority
          path: backend/.verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
