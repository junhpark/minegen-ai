[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minegen"
version = "0.1.0"
description = "MineGen-AI backend: generative underground mine design research platform"
requires-python = ">=3.12"
dependencies = [
    # Phase 01: web layer + schemas + numerics foundation.
    # scipy / trimesh / ortools are added in the phase that first
    # needs them (CLAUDE.md rule 15). networkx added in Phase 07 (MineNetwork).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "networkx>=3.3",
    # Phase 02: scipy.ndimage for anisotropic Gaussian smoothing of the
    # rock-quality / grade fields and for terrain octave upsampling.
    "scipy>=1.13",
    # Phase 19: scikit-image's proven marching-cubes (Lewiner) extracts the
    # DERIVED render mesh of the implicit WARPED_VEIN orebody. A hand-written
    # triangulator would be fragile for no benefit (directive §13).
    "scikit-image>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",        # FastAPI TestClient transport
    "ruff>=0.5",
    "mypy>=1.10",
    "types-networkx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# --strict-markers: an unregistered marker (typo) is a collection ERROR, never
# a silently unmarked test (VA-01 §16).
addopts = "-q --strict-markers"
# VA-01 verification tiers. Unmarked tests form the FAST inner loop; every
# marked test is still collected by FULL (scripts/verify.py enforces
# collected(FULL) == collected(unfiltered) mechanically). Markers are assigned
# centrally in tests/conftest.py from explicit tables (runtime + role).
markers = [
    "slow: high-cost test with low inner-loop repeat value (>= ~8 s or an expensive shared fixture); FEATURE/FULL only",
    "golden: locked contract / metric comparison against a committed golden baseline",
    "survey: multi-seed deterministic survey (FULL closeout)",
    "e2e: clean pipeline integration through the service/API layer",
    "legacy_regression: locked historical Hybrid-A* regression suite (smoke subset in pytest)",
    "benchmark: runtime observation only, never a correctness authority",
    "canary: representative-scenario regression detector (TABULAR-REFERENCE / WARPED-301 / WARPED-307); clean in FEATURE and FULL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "RUF002", "RUF003"]  # unicode math symbols are fine in docstrings

[tool.ruff.lint.isort]
known-first-party = ["minegen"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["minegen"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*"]
ignore_missing_imports = true
